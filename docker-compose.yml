version: '3.8'

services:
  # ─── ZooKeeper ───────────────────────────────────────────────────────────────
  # Kafka needs ZooKeeper to track which brokers are alive, where topics live,
  # and who the leader is for each partition. Think of it as Kafka's DNS.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: threads-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ─── Kafka ───────────────────────────────────────────────────────────────────
  # The message broker. Your Node app connects to localhost:9092.
  # Two listeners are required:
  #   PLAINTEXT       → used by containers talking to each other (internal Docker network)
  #   PLAINTEXT_HOST  → used by your Node app running on your Mac (host machine)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: threads-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Auto-create topics — the "Messages" topic will be created on first use
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Keep messages for 7 days (168 hours) — long enough to replay if DB writer falls behind
      KAFKA_LOG_RETENTION_HOURS: 168

  # ─── MongoDB ─────────────────────────────────────────────────────────────────
  # Primary database. Data is persisted to a named volume so it survives
  # container restarts. Without the volume, data disappears on `docker-compose down`.
  mongo:
    image: mongo:7.0
    container_name: threads-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ─── Redis ───────────────────────────────────────────────────────────────────
  # Two jobs:
  #   1. Socket.IO Redis adapter — lets multiple Node servers share socket events
  #      so private messages route correctly regardless of which server the user landed on
  #   2. User→socketId map — stores `user:{username} = socketId` so the server
  #      can find where to send a private message
  redis:
    image: redis:7.2-alpine
    container_name: threads-redis
    ports:
      - "6379:6379"
    # appendonly persistence — Redis writes every command to disk
    # so user sessions survive a Redis restart
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
